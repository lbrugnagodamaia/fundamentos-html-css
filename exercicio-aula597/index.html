<!--Crie uma página contendo os seguintes elementos:
1. Cabeçalho
Um <header> no topo da página.
Ele deve permanecer visível quando a página for rolada.
Utilize o tipo de posicionamento adequado. 

2. Caixa Relative
Crie uma caixa com o texto:
Relative
Requisitos:
Defina largura e altura.
Mova a caixa alguns pixels para a direita e para baixo utilizando propriedades de posicionamento.

3. Caixa Absolute
Crie uma caixa maior (container) contendo uma caixa menor.
Requisitos:
A caixa menor deve ficar posicionada no canto inferior direito da caixa maior.
Utilize o posicionamento adequado para isso.

4. Botão Fixo
Crie um botão com o texto:
Ajuda
Requisitos:
O botão deve permanecer sempre visível.
Deve ficar no canto inferior direito da tela.
Mesmo ao rolar a página ele deve permanecer no mesmo local.
----feito----

5. Card de Produto
Crie um card contendo:
Uma área simulando uma imagem.
Nome do produto.
Preço.
Adicione também um selo com o texto:
PROMOÇÃO
Requisitos:
O selo deve ficar sobre a imagem.
O selo não pode sair dos limites do card.
Utilize posicionamento para realizar isso.

6. Conteúdo para Teste
Adicione vários parágrafos de texto para gerar rolagem na página.
Objetivo:
Verificar o comportamento do cabeçalho.
Verificar o comportamento do botão fixo.-->
