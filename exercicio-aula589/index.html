<!--Aula 589: Pseudo-elementos
Exercício:
Crie uma lista <ul> com 3 itens. Use ::before para adicionar um ícone antes de cada item, e ::after para colocar uma linha decorativa depois de cada item.-->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Aula 589: Pseudo-elementos</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <ul class="lista">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
</body>

</html>
