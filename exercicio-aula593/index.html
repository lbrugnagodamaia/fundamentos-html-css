<!--Crie 3 caixas que fiquem uma ao lado da outra. Primeiro usando float, depois display: 
inline-block. Qual diferença você percebe entre os dois métodos?-->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Aula 593: Float e display</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="box-float">1</div>
    <div class="box-float">2</div>
    <div class="box-float">3</div>

    <div class="box-display">4</div>
    <div class="box-display">5</div>
    <div class="box-display">6</div>
</body>
