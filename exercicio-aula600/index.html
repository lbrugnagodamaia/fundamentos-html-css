<!--Utilizando uma única página, crie:

Crie uma página contendo os seguintes elementos:

1. Caixa com cantos arredondados
Crie uma <div> com um texto dentro.
Requisitos:
Defina largura e altura.
Aplique uma cor de fundo.
Arredonde igualmente os quatro cantos utilizando border-radius.

2. Botão personalizado
Crie um botão com o texto:
Comprar
Requisitos:
Defina largura e altura.
Deixe o botão com aparência moderna utilizando border-radius.
Escolha cores que combinem entre si.

3. Card de produto
Crie um card contendo:
Área para imagem (pode ser apenas uma div)
Nome do produto
Preço
Botão "Comprar"
Requisitos:
O card deve possuir cantos arredondados.
A imagem também deve possuir cantos arredondados.
O botão deve acompanhar o mesmo estilo visual.

4. Avatar
Crie uma caixa quadrada simulando uma foto de perfil.
Requisitos:
Transforme essa caixa em um círculo perfeito utilizando apenas CSS.

5. Caixa com cantos diferentes
Crie uma nova caixa.
Requisitos:
Cada canto deve possuir um arredondamento diferente.
Experimente criar um efeito assimétrico.

6. Cápsula (Pill)
Crie um selo com o texto:
Novo
Requisitos:
O selo deve ficar parecido com uma etiqueta de aplicativos ou lojas virtuais.
Utilize border-radius para criar o efeito de cápsula.

Desafio Final
Monte um pequeno perfil de usuário contendo:
Avatar circular
Nome
Cargo
Botão "Seguir"
Todos os elementos devem seguir o mesmo padrão visual utilizando border-radius.
-->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Aula 600: Border Radius</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div class="caixa-arredondada">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum.
    </div>

    <button class="botao-personalizado">Comprar</button>

    <div class="card-produto">
        <div class="imagem-produto"></div>
        <h2>Nome do Produto</h2>
        <p>R$ 99,99</p>
        <button class="botao-comprar">Comprar</button>
    </div>

    <div class="avatar"></div>

    <div class="caixa-cantos-diferentes"></div>

    <div class="capsula">Novo</div>

    <div class="perfil-usuario">
        <div class="avatar-perfil"></div>
        <h3>Nome do Usuário</h3>
        <p>Cargo do Usuário</p>
        <button class="botao-seguir">Seguir</button>
    </div>

</body>

</html>
